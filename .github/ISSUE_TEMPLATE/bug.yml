name: Bug report
description: Something broken or behaving unexpectedly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The shortest reliable sequence of steps, including what you added (URL / owner/repo / feed) and which setting you changed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines from the container (docker logs / Ollama server log in Settings → AI). No secrets, please.
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Docker Hub image (docker run / compose)
        - Built from source (docker build / Portainer stack)
        - npm (local dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit hash (git rev-parse --short HEAD)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / hardware
      description: e.g. TrueNAS SCALE 24.10, Debian 12 on an N100
    validations:
      required: true
