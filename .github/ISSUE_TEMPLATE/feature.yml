name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that ProjectPulse can't do (or can only do with friction) today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Ideal solution
      description: How should it work from your point of view? A rough UI sketch or a link to a similar feature elsewhere is great here.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've tried to achieve this.
