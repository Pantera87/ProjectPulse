services:
  projectpulse:
    image: pantera87/projectpulse:latest
    # No container_name on purpose — Portainer prefixes containers with the
    # stack name, which keeps the naming clean and conflict-free.
    ports:
      - "4701:4701"
    volumes:
      - projectpulse_data:/data          # SQLite DB + snapshots — survives container upgrades
    environment:
      # IANA timezone (e.g. Europe/Athens). Controls the scheduler, log
      # timestamps, and the times shown in the UI. Change it and restart
      # the container — the UI picks it up automatically.
      TZ: Europe/London
      # --- optional (uncomment and fill in; Portainer has no .env file, so
      # --- values go straight into this file) ---
      # GITHUB_TOKEN: "ghp_xxx"            # raises GitHub API limit 60 → 5000 req/h
      # AUTH_PASSWORD: "secret"            # enables a login screen
      # WEBHOOK_URL: "http://host/hook"     # forwards each new update as JSON
      # AI_ENABLED: "false"                # set "false" to force heuristics (hard kill-switch)
      OLLAMA_URL: "http://ollama:11434"    # bundled ollama service (below) — the default; change to point elsewhere
      # OLLAMA_MODEL: "qwen3.5:4b"         # model pulled by the ollama-init service
      # OLLAMA_KEEP_ALIVE: "5"             # auto-unload the model N minutes after use ("never" = keep loaded)
      # OPENAI_URL: "https://api.openai.com/v1"   # any OpenAI-compatible endpoint
      # OPENAI_API_KEY: "sk-..."
      # ANTHROPIC_API_KEY: "sk-ant-..."
      # MCP_URL: "http://host:port/mcp"     # remote MCP server (Streamable HTTP)
      # SCHEDULER_INTERVAL_MINUTES: "5"
      # SNAPSHOT_KEEP_VERSIONS: "10"
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4701/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3

  # --- Local AI: Ollama (bundled by default) ---
  # The app points at it out of the box (http://ollama:11434). The model
  # library lives in the named volume `ollama_data`, so models survive
  # container upgrades. Remove both ollama services below if you'd rather
  # use a remote provider (OpenAI-compatible / Anthropic / MCP).
  #
  # GPU (NVIDIA): install the NVIDIA Container Toolkit on the host, then add
  # under `ollama`:
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"        # host access (ollama CLI, manual pulls); safe to remove
    environment:
      - OLLAMA_HOST=0.0.0.0:11434   # listen beyond loopback (needed for host access)
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      # 60 s cadence — the 10 s default kept waking the Ollama server on an
      # always-on machine for no reason (the app probes Ollama itself).
      interval: 60s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: pre-downloads the default model once the server is healthy;
  # exits instantly if the model is already present. Shows up as "Exited
  # (0)" in Portainer after it runs — that's normal. Change the model by
  # editing the command line (and OLLAMA_MODEL in projectpulse to match).
  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["ollama"]
    command: ["pull", "qwen3.5:4b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  projectpulse_data:
  ollama_data:
